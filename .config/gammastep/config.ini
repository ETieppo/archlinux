[general]
; day (default) and night color temperature
temp-day=6500
temp-night=2000

; time-based mode (does NOT use geoclue2 or location)
; "start-end" ranges: the color changes linearly across the whole range
; dusk = day -> night | dawn = night -> day
; quickshell reads dawn-time to wake the screen brightness and keyboard light
dusk-time=17:30-21:30
dawn-time=6:00-8:30

; smooth fade on start/stop
fade=1

; uncomment according to your display server:
;adjustment-method=wayland
;adjustment-method=randr
