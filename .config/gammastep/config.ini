[general]
; temperatura de dia (padrão) e de noite
temp-day=6500
temp-night=2000

; modo por horário (NÃO usa geoclue2 nem localização)
; faixas "início-fim": a cor muda linearmente ao longo de toda a faixa
; dusk = anoitecer (dia -> noite) | dawn = amanhecer (noite -> dia)
; o quickshell lê estas mesmas faixas para o brilho da tela e a luz do teclado
dusk-time=17:30-21:30
dawn-time=6:00-8:30

; fade suave ao iniciar/parar
fade=1

; descomente conforme seu servidor gráfico:
;adjustment-method=wayland
;adjustment-method=randr
