font_family family="IosevkaCustom Nerd Font Extended"
bold_font family="IosevkaCustom Nerd Font Extended" style="Bold"
italic_font family="IosevkaCustom Nerd Font Extended" style="Italic"
bold_italic_font family="IosevkaCustom Nerd Font Extended" style="Bold Italic"
font_size 12
modify_font cell_height 110%

background #0c0d12
foreground #686868
cursor #00ff00
cursor_text_color #000000
selection_foreground #a500ff
selection_background #171827
color0 #1d1f21
color1 #e41951
color2 #01dc84
color3 #faf945
color4 #81a2be
color5 #b294bb
color6 #8abeb7
color7 #c5c8c6
color8 #666666
color9 #ff0051
color10 #60fa68
color11 #fffc67
color12 #7aa6da
color13 #c397d8
color14 #70c0b1
color15 #eaeaea

cursor_shape block
window_padding_width 1.5
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0

map alt+n new_os_window_with_cwd
map alt+shift+comma load_config_file
